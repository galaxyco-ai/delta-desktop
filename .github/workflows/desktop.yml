name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop JS deps
        working-directory: desktop
        run: npm ci

      - name: Require updater signing secrets on tags
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. Generate a keypair with"
            echo "  cd desktop && npx tauri signer generate -w ~/.tauri/delta-desktop.key"
            echo "then add the private key and password as repo Actions secrets"
            echo "and paste the public key into desktop/src-tauri/tauri.conf.json."
            exit 1
          fi

      - name: Choose tauri build args
        id: tauri-args
        shell: bash
        run: |
          args="--bundles nsis,msi"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/tauri-no-updater.json"
            args="$args --config $RUNNER_TEMP/tauri-no-updater.json"
            echo "signing key absent; updater artifacts disabled"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          # Empty on workflow_dispatch so the action builds without a GitHub Release.
          # A release is created only for desktop-v* tag pushes.
          tagName: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: "Delta ${{ github.ref_name }}"
          releaseBody: |
            Windows desktop shell for https://delta.galaxyco.ai.

            This build is unsigned. SmartScreen will warn; use More info, Run anyway.
            See desktop/README.md for updater and signing notes.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') }}
          updaterJsonPreferNsis: true
          args: ${{ steps.tauri-args.outputs.args }}

      - name: Upload installers (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: delta-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*
            desktop/src-tauri/target/release/bundle/msi/*
          if-no-files-found: error
